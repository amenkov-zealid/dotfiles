"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_metrics\
$python\
$cmd_duration\
$line_break\
$character
"""
#
#
add_newline = true
#
#
# A minimal left prompt
# format = """$python$directory$character"""

# move the rest of the prompt to the right
# right_format = """$all"""
#

[directory]
style = "blue"
# read_only = " 󰌾"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
# format = '[$symbol$branch]($style)'
style = "bright-black"
# symbol = ""

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
style = "cyan"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_metrics]
added_style = 'blue'
deleted_style = 'red'
format = '\[[+$added]($added_style)/[-$deleted]($deleted_style)\] '
disabled = false

[cmd_duration]
format = '[⏱ $duration]($style)'
style = "yellow"

[python]
format = '[ (${version})]($style) '
style = "bright-black"
detect_extensions = []
detect_files = []
