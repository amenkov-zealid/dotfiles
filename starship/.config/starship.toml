"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$git_metrics\
$fill\
$python\
$cmd_duration\
$line_break\
$character
"""
#
#
add_newline = true
#
#
# A minimal left prompt
# format = """$python$directory$character"""
#

[fill]
symbol = " "

[directory]
style = "blue"
# read_only = " 󰌾"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
# format = '[$symbol$branch]($style)'
style = "bright-black"
# symbol = ""

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold"
conflicted = "[ ${count}](bold red) "
ahead = "[ ${count}](bold green) "
behind = "[ ${count}](bold red) "
diverged = "[ ${ahead_count}/${behind_count}](bold magenta) "
untracked = "[  ${count}](yellow) "
stashed = "[ ${count}](blue) "
modified = "[ ${count}](yellow) "
staged = "[ ${count}](green) "
renamed = "[ ${count}](cyan) "
deleted = "[ ${count}](red) "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_metrics]
added_style = 'blue'
deleted_style = 'red'
format = '\[[+$added]($added_style)/[-$deleted]($deleted_style)\] '
disabled = true

[cmd_duration]
format = '[⏱ $duration]($style)'
style = "yellow"
disabled = false

[python]
format = '[ (${version})]($style) '
style = "bright-black"
disabled = false
