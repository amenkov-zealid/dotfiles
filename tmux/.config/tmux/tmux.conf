# =============================================================================
# MERGED TMUX CONFIG
# Prefix: C-s | Theme: Nord | Claude Code compatible | Ghostty safe
# =============================================================================

# -----------------------------------------------------------------------------
# PREFIX
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# -----------------------------------------------------------------------------
# CLAUDE CODE / TERMINAL
# https://code.claude.com/docs/en/terminal-config#configure-tmux
# -----------------------------------------------------------------------------
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set-option -g focus-events on

# Agent notifications
# setw -g monitor-bell on
# set-window-option -g visual-bell on
# set -g bell-action any
# set -g activity-action any
# setw -g window-status-bell-style 'fg=#787487 underscore'

# Correctly pass modified keys to processes running in tmux
set -g extended-keys on
set -g extended-keys-format csi-u

# -----------------------------------------------------------------------------
# CORE SETTINGS
# -----------------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
# Rename window to dir instead of process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g pane-border-lines heavy

# Default shell for new panes/windows (independent of the terminal that launched tmux)
set -g default-shell /opt/homebrew/bin/fish

# -----------------------------------------------------------------------------
# SPLITS
# -----------------------------------------------------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# PANE NAVIGATION (prefix + vim keys)
# C-h/j/k/l handled by vim-tmux-navigator
# -----------------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------------------------------
# WINDOW / PANE NAVIGATION (no prefix)
# M-Left/Right omitted: conflicts with readline word-movement in Ghostty
# (macos_alt_as_option=true sends \eb/\ef for Option+Left/Right)
# -----------------------------------------------------------------------------
bind -n M-H     previous-window
bind -n M-L     next-window
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# -----------------------------------------------------------------------------
# COPY MODE (vi-style; tmux-yank handles clipboard)
# -----------------------------------------------------------------------------
# set-window-option -g mode-keys vi
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
set -s set-clipboard on
# setw -g mode-style 'fg=#a7d8b0'

# -----------------------------------------------------------------------------
# SESSION MANAGEMENT
# -----------------------------------------------------------------------------
bind s choose-tree -Zs
bind S new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind b last-window

# ================================
# SAFE RECOVERY (VERY IMPORTANT)
# ================================

# instant "fix everything if tmux feels broken"
bind C-g run-shell "tmux refresh-client -S \; display-message 'tmux reset'"

# -----------------------------------------------------------------------------
# UTILITIES
# -----------------------------------------------------------------------------
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "Config reloaded!"
bind z resize-pane -Z
bind e setw synchronize-panes

# -----------------------------------------------------------------------------
# THEME: Catppuccin (mocha)
# https://github.com/catppuccin/tmux
# -----------------------------------------------------------------------------
set -g @catppuccin_flavor 'mocha'
# Show window name (#W), not pane title (#T, usually blank) — Catppuccin defaults to #T
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_window_status_style 'basic'

# Load catppuccin directly (not via the batched tpm run below) so its
# @catppuccin_status_* vars and @thm_* colors exist before we build the
# status line below.
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# -----------------------------------------------------------------------------
# STATUS LINE (Catppuccin modules)
# Must be built before the tpm run below: tmux-battery does a one-time
# text-substitution of status-right when IT loads, swapping the literal
# #{battery_percentage} for a real script call. If status-right isn't
# already in place when tmux-battery loads, there's nothing for it to find.
# -----------------------------------------------------------------------------
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
# set -g status-right "#[fg=#{@thm_crust},bg=#{@thm_lavender}] %H:%M "
set -gF status-right "#{E:@catppuccin_status_battery}"

# -----------------------------------------------------------------------------
# PLUGINS
# TPM must be last; install with prefix + I
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'arcticicestudio/nord-tmux'  # disabled: replaced by Catppuccin below
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-battery'

run '/opt/homebrew/opt/tpm/share/tpm/tpm'
